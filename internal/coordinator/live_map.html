<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Live Robot Map</title>
    <style>
      body {
        font-family: sans-serif;
        background: #111;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 20px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(20, 24px);
        grid-template-rows: repeat(20, 24px);
        gap: 2px;
        margin-top: 16px;
      }
      .cell {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        background: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #eee;
      }
      .robot {
        color: #fff;
        font-weight: bold;
      }

      .robot-detector {
        background: #2e86de;
      }

      .robot-cleaner {
        background: #9b59b6;
      }

      .robot-repair {
        background: #e67e22;
      }

      .dirt {
        background: #0b5d2f;
      }

      .defect {
        background: #b22222;
      }
    </style>
  </head>
  <body>
    <h1>Live Robot Map (20x20)</h1>
    <p>
      Data source: <code>/map</code>. Polling every 500ms. Left click = dirt
      (green), right click = defect (red).
    </p>
    <p style="font-size: 12px">
      <span
        style="
          background: #2e86de;
          padding: 2px 8px;
          border-radius: 3px;
          margin-right: 8px;
        "
        >Detector</span
      >
      <span
        style="
          background: #9b59b6;
          padding: 2px 8px;
          border-radius: 3px;
          margin-right: 8px;
        "
        >Cleaner</span
      >
      <span
        style="
          background: #e67e22;
          padding: 2px 8px;
          border-radius: 3px;
          margin-right: 8px;
        "
        >Repair</span
      >
      <span
        style="
          background: #0b5d2f;
          padding: 2px 8px;
          border-radius: 3px;
          margin-right: 8px;
        "
        >Dirt</span
      >
      <span style="background: #b22222; padding: 2px 8px; border-radius: 3px"
        >Defect</span
      >
    </p>
    <div id="grid"></div>
    <script>
      const gridEl = document.getElementById("grid");

      function buildEmptyGrid(width, height) {
        const cells = [];
        gridEl.innerHTML = "";
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const div = document.createElement("div");
            div.className = "cell";
            div.textContent = "";
            div.dataset.x = x;
            div.dataset.y = y;
            gridEl.appendChild(div);
            cells.push(div);
          }
        }
        return cells;
      }

      let cells = null;

      async function update() {
        try {
          const res = await fetch("/map");
          if (!res.ok) return;
          const data = await res.json();
          const { width, height, robots, problems } = data;

          if (!cells || cells.length !== width * height) {
            cells = buildEmptyGrid(width, height);
          }

          // clear all cells
          for (const cell of cells) {
            cell.className = "cell";
            cell.textContent = "";
          }

          // place problems first
          if (Array.isArray(problems)) {
            problems.forEach((p) => {
              const px = p.x ?? p.X; // handle lower-case JSON keys from Go
              const py = p.y ?? p.Y;
              const pt = p.type ?? p.Type;
              if (px < 0 || py < 0 || px >= width || py >= height) return;
              const i = py * width + px;
              const cell = cells[i];
              if (!cell) return;
              if (pt === "dirt") {
                cell.classList.add("dirt");
              } else if (pt === "defect") {
                cell.classList.add("defect");
              }
            });
          }

          // place robots
          robots.forEach((r, idx) => {
            if (r.X < 0 || r.Y < 0 || r.X >= width || r.Y >= height) return;
            const i = r.Y * width + r.X;
            const cell = cells[i];
            if (!cell) return;
            cell.classList.add("robot");
            // Add type-specific class for coloring
            const robotType = r.type || "detector";
            cell.classList.add("robot-" + robotType);
            // show first robot ID or "+" if multiple
            if (cell.textContent === "") {
              cell.textContent = String(r.ID);
            } else {
              cell.textContent = "+";
            }
          });
        } catch (e) {
          // ignore errors; next tick will retry
        }
      }

      update();
      setInterval(update, 500);

      async function sendProblem(x, y, type) {
        await fetch("/problem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ x, y, type }),
        });
        update();
      }

      gridEl.addEventListener("click", (ev) => {
        const cell = ev.target.closest(".cell");
        if (!cell || cell.dataset.x === undefined) return;
        sendProblem(Number(cell.dataset.x), Number(cell.dataset.y), "dirt");
      });

      gridEl.addEventListener("contextmenu", (ev) => {
        ev.preventDefault();
        const cell = ev.target.closest(".cell");
        if (!cell || cell.dataset.x === undefined) return;
        sendProblem(Number(cell.dataset.x), Number(cell.dataset.y), "defect");
      });
    </script>
  </body>
</html>
