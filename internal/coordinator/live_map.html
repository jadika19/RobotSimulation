<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Live Robot Map</title>
    <style>
      body {
        font-family: sans-serif;
        background: #111;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 20px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(20, 24px);
        grid-template-rows: repeat(20, 24px);
        gap: 2px;
        margin-top: 16px;
      }
      .cell {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        background: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #eee;
      }
      .robot {
        background: #2e86de;
        color: #fff;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Live Robot Map (20x20)</h1>
    <p>Data source: <code>/map</code>. Polling every 500ms.</p>
    <div id="grid"></div>
    <script>
      const gridEl = document.getElementById("grid");

      function buildEmptyGrid(width, height) {
        const cells = [];
        gridEl.innerHTML = "";
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const div = document.createElement("div");
            div.className = "cell";
            div.textContent = "";
            gridEl.appendChild(div);
            cells.push(div);
          }
        }
        return cells;
      }

      let cells = null;

      async function update() {
        try {
          const res = await fetch("/map");
          if (!res.ok) return;
          const data = await res.json();
          const { width, height, robots } = data;

          if (!cells || cells.length !== width * height) {
            cells = buildEmptyGrid(width, height);
          }

          // clear all cells
          for (const cell of cells) {
            cell.className = "cell";
            cell.textContent = "";
          }

          // place robots
          robots.forEach((r, idx) => {
            if (r.X < 0 || r.Y < 0 || r.X >= width || r.Y >= height) return;
            const i = r.Y * width + r.X;
            const cell = cells[i];
            if (!cell) return;
            cell.className = "cell robot";
            // show first robot ID or "+" if multiple
            if (cell.textContent === "") {
              cell.textContent = String(r.ID);
            } else {
              cell.textContent = "+";
            }
          });
        } catch (e) {
          // ignore errors; next tick will retry
        }
      }

      update();
      setInterval(update, 500);
    </script>
  </body>
</html>
