services:
  coordinator:
    build:
      context: ../../
      dockerfile: deployments/docker/coordinator/Dockerfile
    ports:
      - "8080:8080"
      - "9001:9001/udp"

  detector:
    build:
      context: ../../
      dockerfile: deployments/docker/detector/Dockerfile
    depends_on:
      - coordinator
    deploy:
      replicas: 3

  cleaner:
    build:
      context: ../../
      dockerfile: deployments/docker/servicebot/Dockerfile
    depends_on:
      - coordinator
    environment:
      - BOT_TYPE=cleaner
    deploy:
      replicas: 2

  repair:
    build:
      context: ../../
      dockerfile: deployments/docker/servicebot/Dockerfile
    depends_on:
      - coordinator
    environment:
      - BOT_TYPE=repair
    deploy:
      replicas: 2
